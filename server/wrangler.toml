# Codora usage counts — Cloudflare Workers config. Deploy runbook: README.md

name = "codora-metrics"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "codora-metrics"
# Replace with the id printed by `npx wrangler d1 create codora-metrics`.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Secret, set with `npx wrangler secret put SUMMARY_TOKEN`:
#   SUMMARY_TOKEN   bearer token for GET /v1/summary
